<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>NEON ESCAPE — 3D</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#02030a;
  font-family:Arial,Helvetica,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  right:15px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  pointer-events:none;
  z-index:10;
}

.box{
  min-width:95px;
  padding:9px 13px;
  margin-bottom:7px;
  border:1px solid rgba(0,240,255,.35);
  border-radius:13px;
  background:rgba(3,8,20,.68);
  backdrop-filter:blur(12px);
  box-shadow:0 0 18px rgba(0,220,255,.15);
  color:white;
}

.label{
  font-size:10px;
  letter-spacing:2px;
  opacity:.65;
}

.value{
  font-size:22px;
  font-weight:900;
  color:#63f8ff;
  text-shadow:0 0 12px #00eaff;
}

#energyWrap{
  width:145px;
}

#energy{
  width:100%;
  height:8px;
  margin-top:7px;
  overflow:hidden;
  border-radius:10px;
  background:#18202c;
}

#energyBar{
  width:100%;
  height:100%;
  background:linear-gradient(90deg,#00eaff,#7aff9a);
  box-shadow:0 0 12px #00eaff;
}

#pause{
  pointer-events:auto;
  width:45px;
  height:45px;
  border:1px solid #00eaff;
  border-radius:14px;
  background:rgba(0,15,30,.75);
  color:white;
  font-size:19px;
}

#screen{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,
    rgba(0,220,255,.12),
    rgba(0,0,0,.78) 55%,
    #02030a);
}

.card{
  width:min(430px,90vw);
  padding:30px;
  border:1px solid rgba(0,238,255,.35);
  border-radius:25px;
  background:rgba(5,9,22,.82);
  backdrop-filter:blur(20px);
  text-align:center;
  color:white;
  box-shadow:
    0 0 60px rgba(0,220,255,.15),
    inset 0 0 30px rgba(255,255,255,.025);
}

.card.hidden{
  display:none;
}

.logo{
  font-size:38px;
  line-height:.95;
  font-weight:1000;
  letter-spacing:3px;
  color:#fff;
  text-shadow:
    0 0 8px #00eaff,
    0 0 30px #007bff;
}

.sub{
  margin-top:12px;
  margin-bottom:22px;
  color:#70efff;
  letter-spacing:4px;
  font-size:11px;
}

.world{
  color:#a8b8c9;
  margin-bottom:22px;
  font-size:13px;
}

.mainBtn{
  width:100%;
  border:0;
  padding:16px;
  margin-top:10px;
  border-radius:15px;
  font-size:16px;
  font-weight:900;
  letter-spacing:2px;
  color:#001018;
  background:linear-gradient(135deg,#6fffff,#00bfff);
  box-shadow:
    0 0 20px rgba(0,230,255,.45),
    inset 0 1px 0 white;
}

.mainBtn:active{
  transform:scale(.97);
}

#characterList{
  display:flex;
  gap:8px;
  margin-bottom:15px;
}

.character{
  flex:1;
  padding:9px 4px;
  border:1px solid #20394a;
  border-radius:12px;
  background:#08111d;
  color:white;
  font-size:9px;
}

.character.active{
  border-color:#00eaff;
  box-shadow:0 0 14px rgba(0,234,255,.35);
}

#message{
  position:fixed;
  z-index:15;
  left:50%;
  top:21%;
  transform:translate(-50%,-50%) scale(.7);
  opacity:0;
  pointer-events:none;
  color:white;
  font-size:28px;
  font-weight:1000;
  letter-spacing:4px;
  text-shadow:0 0 20px #00eaff;
  transition:.25s;
}

#message.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

#controls{
  position:fixed;
  z-index:12;
  left:0;
  right:0;
  bottom:20px;
  display:flex;
  justify-content:center;
  gap:14px;
  pointer-events:none;
}

.control{
  pointer-events:auto;
  width:70px;
  height:58px;
  border-radius:18px;
  border:1px solid rgba(0,240,255,.4);
  background:rgba(3,12,25,.68);
  color:white;
  font-size:25px;
  backdrop-filter:blur(10px);
  box-shadow:0 0 15px rgba(0,220,255,.14);
}

.control:active{
  transform:scale(.9);
  background:rgba(0,180,220,.3);
}

.small{
  color:#8293a7;
  font-size:11px;
  margin-top:15px;
  line-height:1.6;
}

@media(max-width:500px){
  .logo{
    font-size:30px;
  }

  .card{
    padding:23px;
  }

  .box{
    min-width:75px;
    padding:7px 9px;
  }

  .value{
    font-size:17px;
  }

  #energyWrap{
    width:110px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">

  <div>
    <div class="box">
      <div class="label">SCORE</div>
      <div class="value" id="score">0</div>
    </div>

    <div class="box">
      <div class="label">LEVEL</div>
      <div class="value" id="level">1</div>
    </div>
  </div>

  <div>
    <div class="box" id="energyWrap">
      <div class="label">ENERGY</div>
      <div id="energy">
        <div id="energyBar"></div>
      </div>
    </div>

    <button id="pause">Ⅱ</button>
  </div>

</div>

<div id="message"></div>

<div id="controls">
  <button class="control" id="left">←</button>
  <button class="control" id="jump">↑</button>
  <button class="control" id="right">→</button>
</div>

<div id="screen">

  <div class="card" id="home">

    <div class="logo">
      NEON<br>ESCAPE
    </div>

    <div class="sub">
      THE LAST SURVIVOR
    </div>

    <div class="world">
      REAL-TIME 3D RUNNER
    </div>

    <div id="characterList">
      <button class="character active" data-char="0">
        NOVA
      </button>

      <button class="character" data-char="1">
        BLAZE
      </button>

      <button class="character" data-char="2">
        CYBER
      </button>

      <button class="character" data-char="3">
        SHADOW
      </button>
    </div>

    <button class="mainBtn" id="start">
      START RUN
    </button>

    <div class="small">
      SWIPE LEFT / RIGHT TO CHANGE LANES<br>
      SWIPE UP TO JUMP • A/D + SPACE ALSO WORK
    </div>

  </div>

  <div class="card hidden" id="pauseCard">

    <div class="logo" style="font-size:30px">
      PAUSED
    </div>

    <div class="sub">
      RUN TEMPORARILY FROZEN
    </div>

    <button class="mainBtn" id="resume">
      RESUME
    </button>

    <button class="mainBtn" id="restartPause">
      RESTART
    </button>

    <button class="mainBtn" id="homePause">
      HOME
    </button>

  </div>

  <div class="card hidden" id="over">

    <div class="logo" style="font-size:30px">
      RUN OVER
    </div>

    <div class="sub">
      YOU WERE CAUGHT
    </div>

    <div class="world">
      SCORE
      <strong id="finalScore">0</strong>
      <br><br>
      BEST
      <strong id="bestScore">0</strong>
    </div>

    <button class="mainBtn" id="restart">
      RUN AGAIN
    </button>

    <button class="mainBtn" id="home">
      HOME
    </button>

  </div>

</div>

<!-- REAL 3D ENGINE -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

"use strict";

/* =====================================================
   BASIC SETUP
===================================================== */

const canvas =
  document.getElementById("game");

const renderer =
  new THREE.WebGLRenderer({
    canvas:canvas,
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

const scene =
  new THREE.Scene();

scene.fog =
  new THREE.FogExp2(
    0x02050d,
    .018
  );

const camera =
  new THREE.PerspectiveCamera(
    62,
    innerWidth/innerHeight,
    .1,
    500
  );

camera.position.set(
  0,
  5,
  10
);


/* =====================================================
   LIGHTING
===================================================== */

const ambient =
  new THREE.AmbientLight(
    0x7899aa,
    1.4
  );

scene.add(ambient);

const moon =
  new THREE.DirectionalLight(
    0x8edcff,
    2.5
  );

moon.position.set(
  -20,
  35,
  15
);

moon.castShadow=true;

moon.shadow.mapSize.width=1024;
moon.shadow.mapSize.height=1024;

scene.add(moon);

const cyanLight =
  new THREE.PointLight(
    0x00eaff,
    18,
    45
  );

cyanLight.position.set(
  0,
  7,
  5
);

scene.add(cyanLight);


/* =====================================================
   WORLD
===================================================== */

const worldGroup =
  new THREE.Group();

scene.add(worldGroup);

const roadGroup =
  new THREE.Group();

scene.add(roadGroup);

const obstacleGroup =
  new THREE.Group();

scene.add(obstacleGroup);

const orbGroup =
  new THREE.Group();

scene.add(orbGroup);

const buildingGroup =
  new THREE.Group();

scene.add(buildingGroup);


/* =====================================================
   MATERIAL HELPERS
===================================================== */

function mat(
  color,
  emissive=0x000000,
  intensity=0
){

  return new THREE.MeshStandardMaterial({

    color:color,

    emissive:emissive,

    emissiveIntensity:intensity,

    roughness:.55,

    metalness:.35

  });
}


/* =====================================================
   ROAD
===================================================== */

const roadMat =
  mat(
    0x11151d
  );

const road =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      11,
      .35,
      500
    ),

    roadMat

  );

road.position.set(
  0,
  -.3,
  -200
);

road.receiveShadow=true;

roadGroup.add(road);


/* SIDE FLOOR */

const sideMat =
  mat(
    0x050911
  );

const side =
  new THREE.Mesh(

    new THREE.BoxGeometry(
      80,
      .25,
      500
    ),

    sideMat

  );

side.position.set(
  0,
  -.48,
  -200
);

roadGroup.add(side);


/* =====================================================
   LANE MARKERS
===================================================== */

const markerMat =
  mat(
    0x00eaff,
    0x00eaff,
    4
  );

for(
  let z=0;
  z>-480;
  z-=9
){

  for(
    const x of [-1.8,1.8]
  ){

    const marker =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          .09,
          .025,
          4.5
        ),

        markerMat

      );

    marker.position.set(
      x,
      -.08,
      z
    );

    roadGroup.add(marker);
  }
}


/* =====================================================
   ROAD SIDE LIGHTS
===================================================== */

function createStreetLight(x,z){

  const g =
    new THREE.Group();

  const pole =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .055,
        .07,
        4.5,
        8
      ),

      mat(0x263746)
    );

  pole.position.y=2.1;

  g.add(pole);

  const lamp =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .18,
        10,
        10
      ),

      mat(
        0x00ffff,
        0x00ffff,
        8
      )
    );

  lamp.position.set(
    0,
    4.35,
    0
  );

  g.add(lamp);

  const light =
    new THREE.PointLight(
      0x00eaff,
      7,
      12
    );

  light.position.copy(
    lamp.position
  );

  g.add(light);

  g.position.set(
    x,
    0,
    z
  );

  return g;
}

for(
  let z=0;
  z>-480;
  z-=18
){

  roadGroup.add(
    createStreetLight(-6,z)
  );

  roadGroup.add(
    createStreetLight(6,z-9)
  );
}


/* =====================================================
   BUILDINGS
===================================================== */

function createBuilding(
  x,
  z,
  w,
  h,
  d
){

  const group =
    new THREE.Group();

  const building =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        w,h,d
      ),

      mat(
        0x08101c,
        0x001a25,
        .5
      )

    );

  building.position.y=
    h/2-.4;

  building.castShadow=true;

  group.add(building);


  const windowMat =
    mat(
      Math.random()>.5
      ?0x00eaff
      :0x9b45ff,

      0x00eaff,
      2
    );


  for(
    let yy=3;
    yy<h-1;
    yy+=3.2
  ){

    for(
      let xx=-w/2+1.2;
      xx<w/2-1;
      xx+=2
    ){

      if(Math.random()<.52){

        const win =
          new THREE.Mesh(

            new THREE.BoxGeometry(
              .65,
              .85,
              .04
            ),

            windowMat

          );

        win.position.set(
          xx,
          yy,
          d/2+.025
        );

        group.add(win);
      }
    }
  }

  group.position.set(
    x,
    0,
    z
  );

  return group;
}


for(
  let z=-10;
  z>-470;
  z-=14
){

  const left =
    createBuilding(
      -10-Math.random()*7,
      z,
      4+Math.random()*4,
      10+Math.random()*22,
      5
    );

  const right =
    createBuilding(
      10+Math.random()*7,
      z-7,
      4+Math.random()*4,
      9+Math.random()*25,
      5
    );

  buildingGroup.add(left);
  buildingGroup.add(right);
}


/* =====================================================
   PLAYER
===================================================== */

const player =
  new THREE.Group();

player.position.set(
  0,
  0,
  5
);

scene.add(player);

const characters=[

  {
    shirt:0x087eff,
    pants:0x172033,
    skin:0xd89b72,
    hair:0x17120e,
    glow:0x00eaff
  },

  {
    shirt:0xff3b30,
    pants:0x15151d,
    skin:0xc98563,
    hair:0x29130b,
    glow:0xff4b38
  },

  {
    shirt:0x7c4dff,
    pants:0x101018,
    skin:0xb97857,
    hair:0x050509,
    glow:0xb76cff
  },

  {
    shirt:0x222832,
    pants:0x090b10,
    skin:0x9f654d,
    hair:0x020204,
    glow:0x9dffff
  }

];

let selectedCharacter=0;


/* PLAYER BODY */

let body;
let head;
let hair;
let leftArm;
let rightArm;
let leftLeg;
let rightLeg;

function buildPlayer(){

  while(
    player.children.length
  ){

    player.remove(
      player.children[0]
    );
  }

  const c =
    characters[selectedCharacter];


  /* BODY */

  body =
    new THREE.Mesh(

      new THREE.CapsuleGeometry(
        .48,
        1.15,
        8,
        16
      ),

      mat(
        c.shirt,
        c.glow,
        .25
      )

    );

  body.position.y=1.55;
  body.castShadow=true;

  player.add(body);


  /* HEAD */

  head =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .38,
        24,
        20
      ),

      mat(c.skin)

    );

  head.position.y=2.65;
  head.castShadow=true;

  player.add(head);


  /* HAIR */

  hair =
    new THREE.Mesh(

      new THREE.SphereGeometry(
        .4,
        20,
        12,
        0,
        Math.PI*2,
        0,
        Math.PI*.52
      ),

      mat(c.hair)

    );

  hair.position.y=2.75;

  player.add(hair);


  /* ARMS */

  leftArm =
    createLimb(
      .15,
      .72,
      c.shirt
    );

  rightArm =
    createLimb(
      .15,
      .72,
      c.shirt
    );

  leftArm.position.set(
    -.58,
    1.65,
    0
  );

  rightArm.position.set(
    .58,
    1.65,
    0
  );

  player.add(leftArm);
  player.add(rightArm);


  /* LEGS */

  leftLeg =
    createLimb(
      .19,
      .82,
      c.pants
    );

  rightLeg =
    createLimb(
      .19,
      .82,
      c.pants
    );

  leftLeg.position.set(
    -.25,
    .65,
    0
  );

  rightLeg.position.set(
    .25,
    .65,
    0
  );

  player.add(leftLeg);
  player.add(rightLeg);


  /* SHOES */

  const shoeMat =
    mat(
      0x10141d,
      c.glow,
      1.5
    );

  const shoeGeo =
    new THREE.BoxGeometry(
      .38,
      .18,
      .65
    );

  const shoe1 =
    new THREE.Mesh(
      shoeGeo,
      shoeMat
    );

  const shoe2 =
    new THREE.Mesh(
      shoeGeo,
      shoeMat
    );

  shoe1.position.set(
    -.25,
    .12,
    -.12
  );

  shoe2.position.set(
    .25,
    .12,
    -.12
  );

  player.add(
    shoe1,
    shoe2
  );


  /* GLOW RING */

  const ring =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        .65,
        .025,
        8,
        40
      ),

      mat(
        c.glow,
        c.glow,
        5
      )

    );

  ring.rotation.x=
    Math.PI/2;

  ring.position.y=.03;

  player.add(ring);
}


function createLimb(
  radius,
  length,
  color
){

  const g =
    new THREE.Group();

  const mesh =
    new THREE.Mesh(

      new THREE.CapsuleGeometry(
        radius,
        length,
        6,
        10
      ),

      mat(color)

    );

  mesh.position.y=
    -length*.35;

  mesh.castShadow=true;

  g.add(mesh);

  return g;
}

buildPlayer();


/* =====================================================
   OBSTACLES
===================================================== */

const obstacles=[];

function createCar(){

  const g =
    new THREE.Group();

  const base =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1.55,
        .55,
        2.6
      ),

      mat(
        0xb3162e,
        0x5b0010,
        .6
      )

    );

  base.position.y=.5;

  base.castShadow=true;

  g.add(base);


  const cabin =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        1.15,
        .48,
        1.2
      ),

      mat(
        0x152432,
        0x00394c,
        .8
      )

    );

  cabin.position.y=.95;

  g.add(cabin);


  const wheelMat =
    mat(0x050505);

  for(
    const x of [-.82,.82]
  ){

    for(
      const z of [-.82,.82]
    ){

      const wheel =
        new THREE.Mesh(

          new THREE.CylinderGeometry(
            .27,
            .27,
            .15,
            14
          ),

          wheelMat

        );

      wheel.rotation.z=
        Math.PI/2;

      wheel.position.set(
        x,
        .32,
        z
      );

      g.add(wheel);
    }
  }

  return g;
}


function createTruck(){

  const g =
    createCar();

  g.scale.set(
    1.25,
    1.35,
    1.35
  );

  return g;
}


function createBarrier(){

  const g =
    new THREE.Group();

  const bar =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        2.4,
        .65,
        .35
      ),

      mat(
        0xff7a00,
        0xff3500,
        2
      )

    );

  bar.position.y=.65;

  g.add(bar);

  for(
    const x of [-.9,.9]
  ){

    const leg =
      new THREE.Mesh(

        new THREE.BoxGeometry(
          .18,
          .7,
          .25
        ),

        mat(0x343a46)

      );

    leg.position.set(
      x,
      .3,
      0
    );

    g.add(leg);
  }

  return g;
}


function spawnObstacle(){

  const types=[
    createCar,
    createCar,
    createTruck,
    createBarrier
  ];

  const obj =
    types[
      Math.floor(
        Math.random()*types.length
      )
    ]();

  const lane =
    Math.floor(
      Math.random()*3
    )-1;

  obj.position.set(
    lane*3.2,
    0,
    -90
  );

  obstacleGroup.add(obj);

  obstacles.push({
    mesh:obj,
    lane:lane,
    speed:22+Math.random()*7
  });
}


/* =====================================================
   ENERGY ORBS
===================================================== */

const orbs=[];

function spawnOrb(){

  const lane =
    Math.floor(
      Math.random()*3
    )-1;

  const orb =
    new THREE.Mesh(

      new THREE.IcosahedronGeometry(
        .35,
        2
      ),

      mat(
        0x00ffff,
        0x00ffff,
        8
      )

    );

  orb.position.set(
    lane*3.2,
    1.3,
    -90
  );

  orbGroup.add(orb);

  orbs.push({
    mesh:orb,
    lane:lane,
    speed:24
  });
}


/* =====================================================
   GAME STATE
===================================================== */

let running=false;
let paused=false;

let score=0;
let level=1;
let energy=100;

let speed=25;

let spawnTimer=0;
let orbTimer=0;

let playerLane=0;
let targetX=0;

let jumpY=0;
let jumpVelocity=0;

let runTime=0;

let last=performance.now();

let best=
  Number(
    localStorage.getItem(
      "neonEscapeBest"
    )||0
  );


/* =====================================================
   DOM
===================================================== */

const scoreEl=
  document.getElementById("score");

const levelEl=
  document.getElementById("level");

const energyBar=
  document.getElementById("energyBar");

const screen=
  document.getElementById("screen");

const homeCard=
  document.getElementById("home");

const pauseCard=
  document.getElementById("pauseCard");

const overCard=
  document.getElementById("over");

const message=
  document.getElementById("message");

const finalScore=
  document.getElementById("finalScore");

const bestScore=
  document.getElementById("bestScore");

const pauseBtn=
  document.getElementById("pause");


/* =====================================================
   GAME STATE
===================================================== */

let running = false;
let paused = false;

let score = 0;
let level = 1;
let energy = 100;

let speed = 25;

let spawnTimer = 500;
let orbTimer = 800;

let playerLane = 0;
let targetX = 0;

let jumpY = 0;
let jumpVelocity = 0;

let runTime = 0;

let last =
  performance.now();

let best =
  Number(
    localStorage.getItem(
      "neonEscapeBest"
    ) || 0
  );


/* =====================================================
   MESSAGE
===================================================== */

let messageTimer;

function showMessage(text){

  message.textContent = text;

  message.classList.add("show");

  clearTimeout(messageTimer);

  messageTimer =
    setTimeout(() => {

      message.classList.remove(
        "show"
      );

    }, 900);
}


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  running = true;
  paused = false;

  score = 0;
  level = 1;
  energy = 100;

  speed = 25;

  spawnTimer = 500;
  orbTimer = 700;

  playerLane = 0;
  targetX = 0;

  jumpY = 0;
  jumpVelocity = 0;

  runTime = 0;

  /* REMOVE OLD OBSTACLES */

  for(
    let i = obstacles.length - 1;
    i >= 0;
    i--
  ){

    obstacleGroup.remove(
      obstacles[i].mesh
    );
  }

  obstacles.length = 0;


  /* REMOVE OLD ORBS */

  for(
    let i = orbs.length - 1;
    i >= 0;
    i--
  ){

    orbGroup.remove(
      orbs[i].mesh
    );
  }

  orbs.length = 0;


  /* RESET PLAYER */

  player.position.x = 0;
  player.position.y = 0;

  player.rotation.set(
    0,
    0,
    0
  );


  /* HIDE MENU */

  screen.style.display =
    "none";

  pauseBtn.style.display =
    "block";


  last =
    performance.now();

  showMessage(
    "GET READY"
  );


  setTimeout(() => {

    if(
      running &&
      !paused
    ){

      showMessage(
        "RUN!"
      );

    }

  }, 700);
}


/* =====================================================
   PAUSE GAME
===================================================== */

function pauseGame(){

  if(!running)
    return;

  paused = true;

  screen.style.display =
    "flex";

  homeCard.classList.add(
    "hidden"
  );

  overCard.classList.add(
    "hidden"
  );

  pauseCard.classList.remove(
    "hidden"
  );

}


/* =====================================================
   RESUME GAME
===================================================== */

function resumeGame(){

  if(!running)
    return;

  paused = false;

  screen.style.display =
    "none";

  pauseCard.classList.add(
    "hidden"
  );

  last =
    performance.now();
}


/* =====================================================
   GAME OVER
===================================================== */

function gameOver(){

  running = false;
  paused = false;

  if(
    Math.floor(score) > best
  ){

    best =
      Math.floor(score);

    localStorage.setItem(
      "neonEscapeBest",
      best
    );
  }

  finalScore.textContent =
    Math.floor(score);

  bestScore.textContent =
    best;

  screen.style.display =
    "flex";

  homeCard.classList.add(
    "hidden"
  );

  pauseCard.classList.add(
    "hidden"
  );

  overCard.classList.remove(
    "hidden"
  );

  pauseBtn.style.display =
    "none";
}


/* =====================================================
   HOME
===================================================== */

function goHome(){

  running = false;
  paused = false;

  screen.style.display =
    "flex";

  homeCard.classList.remove(
    "hidden"
  );

  pauseCard.classList.add(
    "hidden"
  );

  overCard.classList.add(
    "hidden"
  );

  pauseBtn.style.display =
    "none";
}


/* =====================================================
   MOVE LEFT
===================================================== */

function moveLeft(){

  if(
    !running ||
    paused
  )
    return;

  playerLane =
    Math.max(
      -1,
      playerLane - 1
    );

  targetX =
    playerLane * 3.2;
}


/* =====================================================
   MOVE RIGHT
===================================================== */

function moveRight(){

  if(
    !running ||
    paused
  )
    return;

  playerLane =
    Math.min(
      1,
      playerLane + 1
    );

  targetX =
    playerLane * 3.2;
}


/* =====================================================
   JUMP
===================================================== */

function jump(){

  if(
    !running ||
    paused
  )
    return;

  if(
    jumpY <= 0.01
  ){

    jumpVelocity = 11;

  }
}


/* =====================================================
   COLLISION
===================================================== */

function checkCollision(
  obj,
  radius
){

  const dx =
    Math.abs(
      obj.position.x -
      player.position.x
    );

  const dz =
    Math.abs(
      obj.position.z -
      player.position.z
    );

  if(
    dx > radius
  )
    return false;

  if(
    dz > 1.6
  )
    return false;

  /*
    If player is high enough,
    jump over obstacle.
  */

  if(
    jumpY > 1.0
  )
    return false;

  return true;
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

  runTime += dt;


  /* SCORE */

  score +=
    dt *
    0.018 *
    speed;


  /* LEVEL */

  level =
    1 +
    Math.floor(
      score / 800
    );


  /* SPEED */

  speed =
    25 +
    level * 2.1;


  /* ENERGY */

  energy -=
    dt * 0.0045;


  if(
    energy <= 0
  ){

    energy = 0;

    gameOver();

    return;
  }


  /* PLAYER LANE */

  player.position.x +=
    (
      targetX -
      player.position.x
    ) *
    Math.min(
      1,
      dt * 0.012
    );


  /* PLAYER JUMP */

  jumpVelocity -=
    28 *
    dt /
    1000;

  jumpY +=
    jumpVelocity *
    dt /
    1000;

  if(
    jumpY < 0
  ){

    jumpY = 0;
    jumpVelocity = 0;

  }

  player.position.y =
    jumpY;


  /* RUNNING ANIMATION */

  const t =
    runTime *
    0.012;


  if(leftArm)
    leftArm.rotation.x =
      Math.sin(t) * 0.85;

  if(rightArm)
    rightArm.rotation.x =
      -Math.sin(t) * 0.85;

  if(leftLeg)
    leftLeg.rotation.x =
      -Math.sin(t) * 0.8;

  if(rightLeg)
    rightLeg.rotation.x =
      Math.sin(t) * 0.8;


  if(body){

    body.rotation.z =
      Math.sin(t * 2) *
      0.025;
  }


  /* =================================================
     SPAWNING
  ================================================= */

  spawnTimer -= dt;
  orbTimer -= dt;


  if(
    spawnTimer <= 0
  ){

    spawnObstacle();

    spawnTimer =
      Math.max(
        360,
        900 -
        level * 28
      ) +
      Math.random() *
      350;
  }


  if(
    orbTimer <= 0
  ){

    spawnOrb();

    orbTimer =
      600 +
      Math.random() *
      650;
  }


  /* =================================================
     OBSTACLES
  ================================================= */

  for(
    let i =
      obstacles.length - 1;
    i >= 0;
    i--
  ){

    const o =
      obstacles[i];

    o.mesh.position.z +=
      o.speed *
      dt /
      1000;


    /* COLLISION */

    if(
      checkCollision(
        o.mesh,
        1.05
      )
    ){

      energy -= 25;

      showMessage(
        energy > 0
        ? "CRASH!"
        : "GAME OVER"
      );


      obstacleGroup.remove(
        o.mesh
      );

      obstacles.splice(
        i,
        1
      );

      continue;
    }


    /* PASSED */

    if(
      o.mesh.position.z >
      15
    ){

      obstacleGroup.remove(
        o.mesh
      );

      obstacles.splice(
        i,
        1
      );

      score += 20;
    }
  }


  /* =================================================
     ENERGY ORBS
  ================================================= */

  for(
    let i =
      orbs.length - 1;
    i >= 0;
    i--
  ){

    const o =
      orbs[i];


    o.mesh.position.z +=
      o.speed *
      dt /
      1000;


    o.mesh.rotation.x +=
      dt * 0.004;

    o.mesh.rotation.y +=
      dt * 0.006;


    o.mesh.position.y =
      1.3 +
      Math.sin(
        runTime * 0.005 +
        i
      ) * 0.18;


    /* COLLECT */

    if(
      checkCollision(
        o.mesh,
        0.75
      )
    ){

      energy =
        Math.min(
          100,
          energy + 8
        );

      score += 50;

      showMessage(
        "+ ENERGY"
      );


      orbGroup.remove(
        o.mesh
      );

      orbs.splice(
        i,
        1
      );

      continue;
    }


    /* PASSED */

    if(
      o.mesh.position.z >
      15
    ){

      orbGroup.remove(
        o.mesh
      );

      orbs.splice(
        i,
        1
      );
    }
  }


  /* =================================================
     CAMERA
  ================================================= */

  camera.position.x +=
    (
      player.position.x * 0.18 -
      camera.position.x
    ) *
    dt *
    0.006;


  camera.position.y +=
    (
      5.1 +
      jumpY * 0.12 -
      camera.position.y
    ) *
    dt *
    0.005;


  camera.lookAt(
    player.position.x * 0.35,
    1.3 + jumpY * 0.1,
    -13
  );


  /* =================================================
     WORLD MOVEMENT
  ================================================= */

  roadGroup.children.forEach(
    obj => {

      /*
        Only recycle objects
        that are actually moving.
      */

      if(
        obj.position.z >
        25
      ){

        obj.position.z -=
          480;
      }
    }
  );


  buildingGroup.children.forEach(
    obj => {

      if(
        obj.position.z >
        30
      ){

        obj.position.z -=
          490;
      }
    }
  );


  /* HUD */

  updateHUD();
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  scoreEl.textContent =
    Math.floor(score);

  levelEl.textContent =
    level;

  energyBar.style.width =
    Math.max(
      0,
      energy
    ) + "%";
}


/* =====================================================
   BUTTON CONTROLS
===================================================== */

const leftButton =
  document.getElementById(
    "left"
  );

const rightButton =
  document.getElementById(
    "right"
  );

const jumpButton =
  document.getElementById(
    "jump"
  );


leftButton.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    moveLeft();

  }
);


rightButton.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    moveRight();

  }
);


jumpButton.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();

    jump();

  }
);


/* =====================================================
   MENU BUTTONS
===================================================== */

document
  .getElementById("start")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("resume")
  .addEventListener(
    "click",
    resumeGame
  );


document
  .getElementById("restartPause")
  .addEventListener(
    "click",
    startGame
  );


document
  .getElementById("homePause")
  .addEventListener(
    "click",
    goHome
  );


document
  .getElementById("restart")
  .addEventListener(
    "click",
    startGame
  );


document
  .querySelector(
    "#over #home"
  )
  .addEventListener(
    "click",
    goHome
  );


pauseBtn.addEventListener(
  "click",
  () => {

    if(!running)
      return;

    if(paused)
      resumeGame();

    else
      pauseGame();

  }
);


/* =====================================================
   CHARACTER SELECT
===================================================== */

document
  .querySelectorAll(
    ".character"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          document
            .querySelectorAll(
              ".character"
            )
            .forEach(
              b =>
                b.classList
                 .remove("active")
            );


          button.classList.add(
            "active"
          );


          selectedCharacter =
            Number(
              button.dataset.char
            );


          buildPlayer();

        }
      );

    }
  );


/* =====================================================
   KEYBOARD
===================================================== */

document.addEventListener(
  "keydown",
  e => {

    const key =
      e.key.toLowerCase();


    if(
      key === "arrowleft" ||
      key === "a"
    ){

      moveLeft();

    }


    if(
      key === "arrowright" ||
      key === "d"
    ){

      moveRight();

    }


    if(
      key === "arrowup" ||
      key === "w" ||
      key === " "
    ){

      e.preventDefault();

      jump();

    }


    if(
      key === "p"
    ){

      if(!running)
        return;

      if(paused)
        resumeGame();

      else
        pauseGame();

    }

  }
);


/* =====================================================
   SWIPE CONTROLS
===================================================== */

let touchStartX = 0;
let touchStartY = 0;


renderer.domElement.addEventListener(
  "touchstart",
  e => {

    const t =
      e.touches[0];

    touchStartX =
      t.clientX;

    touchStartY =
      t.clientY;

  },
  {
    passive:true
  }
);


renderer.domElement.addEventListener(
  "touchend",
  e => {

    const t =
      e.changedTouches[0];

    const dx =
      t.clientX -
      touchStartX;

    const dy =
      t.clientY -
      touchStartY;


    if(
      Math.abs(dx) >
      Math.abs(dy)
    ){

      if(
        Math.abs(dx) > 35
      ){

        if(dx < 0)
          moveLeft();

        else
          moveRight();

      }

    }
    else{

      if(
        dy < -35
      ){

        jump();

      }

    }

  },
  {
    passive:true
  }
);


/* =====================================================
   AUTO PAUSE
===================================================== */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.hidden &&
      running &&
      !paused
    ){

      pauseGame();

    }

  }
);


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      innerWidth,
      innerHeight
    );


    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

  }
);


/* =====================================================
   INITIALIZE
===================================================== */

goHome();

updateHUD();


/* =====================================================
   3D RENDER LOOP
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  const now =
    performance.now();


  const dt =
    Math.min(
      40,
      now - last
    );


  last = now;


  if(
    running &&
    !paused
  ){

    update(dt);

  }


  renderer.render(
    scene,
    camera
  );
}


/* =====================================================
   START
===================================================== */

animate();

</script>
